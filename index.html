<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Музыкальные инструменты</title>
</head>
<body>
    <div class="container">
        <h2>Выберите инструмент</h2>
        <div class="inner">
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/GuitareClassique5.png/240px-GuitareClassique5.png" alt="Гитара">
                <button class="btn" id="btn_guitar">Гитара</button>
            </div>
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Grand_piano.jpg/240px-Grand_piano.jpg" alt="Пианино">
                <button class="btn" id="btn_piano">Пианино</button>
            </div>
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Violin_VL100.jpg/240px-Violin_VL100.jpg" alt="Скрипка">
                <button class="btn" id="btn_violin">Скрипка</button>
            </div>
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Drum_kit.jpg/240px-Drum_kit.jpg" alt="Барабаны">
                <button class="btn" id="btn_drums">Барабаны</button>
            </div>
        </div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
